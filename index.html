    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      "name": "Audela",
      "url": "https://audela.me",
      "logo": "https://audela.me/Brand-Assets/Audella-ai-logo.svg",

        "@type": "ContactPoint",
        "contactType": "sales",
        "email": "contact@audela.me"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Audela",
      "url": "https://audela.me",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://audela.me/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
